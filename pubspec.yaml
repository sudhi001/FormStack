name: formstack
description: A cross-platform ResearchKit and ODK alternative for Flutter. Build dynamic forms and surveys with 35 input types, 35+ validators, repeat groups, offline save, and multi-language.
version: 3.0.0
homepage: https://github.com/sudhi001/FormStack
repository: https://github.com/sudhi001/FormStack
issue_tracker: https://github.com/sudhi001/FormStack/issues
topics:
  - forms
  - survey
  - ui
  - json
  - widgets
screenshots:
  - description: 'Logo of formstack framework'
    path: screenshots/logo.png

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

# The declared floor is one CI actually builds and tests against, in the
# `min-sdk` job -- an untested floor is a guess. The library's own APIs need
# Flutter 3.27 (Color.withValues), and the toolchain needs Dart 3.8
# (flutter_lints 6), so 3.8/3.32 is the lowest verifiable combination.
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  webview_flutter: ^4.13.1
  rxdart: ^0.28.0
  dio: ^5.9.2
  uuid: ^4.5.3
  web: ^1.1.1
  reviews_slider: ^2.0.0
  lottie: ^3.3.2
  collection: ^1.19.1
  file_picker: ^12.1.2
  google_maps_flutter_web: ^0.6.2
  google_maps_flutter: ^2.17.0
  location: ^10.0.2
  google_maps: ^8.2.0
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/lottiefiles/
    - screenshots/logo.png
